spring:
  application:
    name: sports-betting-settlement
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sports_betting_db}
    username: ${DB_USER:sports_betting_user}
    password: ${DB_PASSWORD:sports_betting_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: sports-betting-settlement
      bet-commands-group-id: sports-betting-bet-commands
      event-outcomes-group-id: sports-betting-event-outcomes
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /api-docs

app:
  cache:
    ttl-seconds: 300
  kafka:
    topics:
      bet-commands: sports-betting.bet-commands.v1
      event-outcomes: event-outcomes
      partitions: 1
      replication-factor: 1
  rocketmq:
    topic: bet-settlements
    mock:
      poll-interval: 200
  settlement:
    match-page-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
